[package]
name    = "pgx_ulid"
publish = false
version = "0.2.3"

edition      = "2021"
rust-version = "1.99.1"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg15"]
pg15    = ["pgrx-tests/pg15", "pgrx/pg15"]
pg16    = ["pgrx-tests/pg16", "pgrx/pg16"]
pg17    = ["pgrx-tests/pg17", "pgrx/pg17"]
pg18    = ["pgrx-tests/pg18", "pgrx/pg18"]
pg19    = ["pgrx-tests/pg19", "pgrx/pg19"]
pg_test = []

[dependencies]
inner_ulid = { package = "ulid", version = "1.1.3" }
pgrx       = "^0.20.1"
serde      = { version = "1.0", features = ["derive"] }

[dev-dependencies]
pgrx-tests = "^0.20.1"

[profile.dev]
panic = "unwind"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "unwind"
